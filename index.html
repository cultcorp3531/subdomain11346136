<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHEFFIN - cult</title>
<style>
  :root{
    --bg: #000000;
    --surface: #131314;
    --line: #F3F1EA;
    --text: #F3F1EA;
    --text-muted: #8F8D85;
    --accent: #FEFEFE;
    --accent-ink: #0B0B0C;
  }

  * { box-sizing: border-box; }

  html{
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding-inline: 0;
    padding-block: 0;
    overflow-x: hidden;
    background-image:
      radial-gradient(rgba(243,241,234,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  .ticker{
    overflow: hidden;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    padding-block: 7px;
  }

  .ticker__track{
    display: inline-flex;
    gap: 2.5rem;
    animation: scroll 16s linear infinite;
  }

  .ticker__track span{
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .ticker__track span b{ color: var(--accent); font-weight: 600; }

  @keyframes scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  @media (prefers-reduced-motion: reduce){
    .ticker__track{ animation: none; }
  }

  main{
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 26px;
    padding-inline: 20px;
    padding-block: 34px 56px;
  }

  .cover{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
    flex-shrink: 0;
  }

  .cover img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover__art{
    position: absolute;
    inset: 0;
  }

  .cover__band{
    position: absolute;
    inset: -10% -20%;
    background: var(--accent);
    clip-path: polygon(0 62%, 100% 38%, 100% 78%, 0 100%);
  }

  .cover__dots{
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(243,241,234,0.55) 1.4px, transparent 1.4px);
    background-size: 9px 9px;
    mix-blend-mode: overlay;
    opacity: 0.5;
  }

  .cover__tag{
    position: absolute;
    top: 14px;
    left: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 3px 8px;
  }

  .cover__artist{
    position: absolute;
    top: 14px;
    right: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
  }

  .cover__title{
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 14px;
    font-family: "Anton", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(30px, 11vw, 46px);
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--text);
    transform: rotate(-2.2deg);
    transform-origin: left bottom;
    text-shadow: 0 0 22px rgba(0,0,0,0.5);
  }

  .meta{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .meta__eyebrow{
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta__eyebrow::before{
    content: "";
    width: 6px;
    height: 6px;
    background: var(--accent);
    display: inline-block;
  }

  .meta h1{
    margin: 0;
    font-family: "Anton", Impact, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(28px, 8vw, 38px);
    line-height: 0.95;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }

  .meta__artist{
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .meta p{
    margin: 0;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--text-muted);
    max-width: 42ch;
  }

  .listen__label{
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text);
    border-bottom: 2px solid var(--accent);
    display: inline-block;
    padding-bottom: 6px;
    margin-bottom: 4px;
  }

  .listen{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .listen a{
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    border: 1.5px solid var(--line);
    background: var(--bg);
    color: var(--text);
    text-decoration: none;
    font-family: "JetBrains Mono", monospace;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: background 0.08s ease, color 0.08s ease;
  }

  .listen a:hover, .listen a:focus-visible{
    background: var(--text);
    color: var(--bg);
    outline: none;
  }

  .listen a:focus-visible{ box-shadow: 0 0 0 2px var(--accent); }

  .listen .icon{
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .listen .icon svg{ width: 100%; height: 100%; fill: currentColor; }

  .listen .name{ flex: 1; }

  .listen .go{ font-size: 15px; }

  .more{
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-top: 1px solid rgba(243,241,234,0.18);
    padding-top: 18px;
  }

  .more a{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-block: 10px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13.5px;
    border-bottom: 1px solid rgba(243,241,234,0.1);
    transition: color 0.1s ease;
  }

  .more a:hover, .more a:focus-visible{ color: var(--text); }

  footer{
    color: var(--text-muted);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    text-align: center;
    padding-top: 4px;
    line-height: 1.6;
  }

  footer code{ color: var(--text); }
</style>
